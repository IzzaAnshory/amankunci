<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmanKunci - Password Manager</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-center">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-xl font-bold mb-1">AmanKunci PWA</h1>
            <p class="text-xs text-slate-400 mb-6">Masukkan PIN Master untuk Membuka Brankas</p>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="password" id="masterPin" placeholder="Masukkan PIN Master" maxlength="10" required
                    class="w-full bg-slate-800 border border-slate-700 text-center tracking-widest text-lg rounded-xl px-4 py-3 mb-4 focus:outline-none focus:border-blue-500">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/30">
                    Buka Brankas
                </button>
            </form>
            <p id="loginError" class="text-red-400 text-xs mt-3 hidden"></p>
        </div>
    </div>

    <!-- HALAMAN UTAMA -->
    <div id="appPage" class="flex-1 flex flex-col hidden max-w-md mx-auto w-full p-4 pb-24">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 pt-2">
            <div>
                <h1 class="text-lg font-bold tracking-tight">Brankas Sandi</h1>
                <p class="text-xs text-slate-400">Sinkron Google Sheets</p>
            </div>
            <div class="flex gap-2">
                <button onclick="fetchAccounts()" class="w-10 h-10 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-center hover:bg-slate-800 transition">
                    <i class="fa-solid fa-rotate text-xs"></i>
                </button>
                <button onclick="lockApp()" class="w-10 h-10 bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl flex items-center justify-center hover:bg-red-500/20 transition" title="Kunci Aplikasi">
                    <i class="fa-solid fa-lock text-xs"></i>
                </button>
            </div>
        </header>

        <!-- Search & Filter Bar -->
        <div class="space-y-3 mb-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" oninput="filterAccounts()" placeholder="Cari layanan atau username..."
                    class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500">
            </div>
            <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
                <button onclick="setCategoryFilter('Semua')" class="cat-btn bg-blue-600 text-white px-3 py-1.5 rounded-lg whitespace-nowrap transition">Semua</button>
                <button onclick="setCategoryFilter('Sosmed')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap transition">Sosmed</button>
                <button onclick="setCategoryFilter('Email')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap transition">Email</button>
                <button onclick="setCategoryFilter('Bank')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap transition">Bank</button>
                <button onclick="setCategoryFilter('Belanja')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap transition">Belanja</button>
            </div>
        </div>

        <!-- Daftar Akun (Cards) -->
        <div id="accountList" class="space-y-3 flex-1">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- Floating Action Button (Tambah Akun) -->
    <button onclick="openModal()" class="fixed bottom-6 right-6 z-30 w-14 h-14 bg-blue-600 hover:bg-blue-500 text-white rounded-full shadow-lg shadow-blue-600/40 flex items-center justify-center text-xl transition">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- MODAL TAMBAH / EDIT -->
    <div id="accountModal" class="fixed inset-0 z-40 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle" class="font-bold text-base">Tambah Akun Baru</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="accountForm" onsubmit="saveAccount(event)" class="space-y-4">
                <input type="hidden" id="accId">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nama Layanan</label>
                    <input type="text" id="accLayanan" required placeholder="cth. Instagram / BCA" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Username / Email</label>
                    <input type="text" id="accUsername" required placeholder="cth. user@gmail.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Password</label>
                    <div class="relative flex">
                        <input type="text" id="accPassword" required placeholder="Password akun" class="w-full bg-slate-800 border border-slate-700 rounded-l-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                        <button type="button" onclick="generatePassword()" class="bg-slate-700 border border-slate-600 px-3 rounded-r-xl text-xs hover:bg-slate-600 transition" title="Generate Password">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                        </button>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Kategori</label>
                        <select id="accKategori" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                            <option value="Sosmed">Sosmed</option>
                            <option value="Email">Email</option>
                            <option value="Bank">Bank</option>
                            <option value="Belanja">Belanja</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">URL (Opsional)</label>
                        <input type="url" id="accUrl" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Catatan</label>
                    <textarea id="accCatatan" rows="2" placeholder="PIN tambahan / catatan keamanan..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-sm transition">Batal</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl text-sm font-semibold transition">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50">
        Pesan Notifikasi
    </div>

    <script src="script.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>
</body>
</html>
